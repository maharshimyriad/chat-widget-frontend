<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Chat widget preview" />
    <title>Chat Widget Preview</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, 'Segoe UI', sans-serif;
        line-height: 1.5;
        --bg: #f4f7fb;
        --text: #172033;
        --muted: #53627c;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: linear-gradient(180deg, #eef4ff 0%, var(--bg) 100%);
        color: var(--text);
      }

      .shell {
        max-width: 1100px;
        margin: 0 auto;
        padding: 48px 20px 80px;
      }

      h1 {
        margin: 0 0 12px;
        font-size: clamp(2rem, 5vw, 2.8rem);
      }

      .intro {
        max-width: 720px;
        margin: 0 0 30px;
        color: var(--muted);
        font-size: 1.05rem;
      }

    </style>
  </head>
  <body>
    <main class="shell">
      <h1>Chat Widget</h1>
      <p class="intro">
        Open the chat widget to try a conversation.
      </p>
    </main>
    <script
      type="module"
      src="/src/main.js"
      data-environment="dam"
      data-api-url="http://127.0.0.1:8000/chat"
    ></script>
  </body>
</html>
